name: Provision
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group: null
  workflow_dispatch: null
concurrency: provision_concurrency_group-${{ github.event.pull_request.number || github.ref_name }}
jobs:
  update-workflow:
    needs: []
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@be3701b2116d2f723573ca9e8cdb4ca85d3cdaf0
      - name: Build the provisioner
        run: docker compose build provisioner
      - name: Set up environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo 'NO_CONFIRM=true' >> .env
            echo 'BACK_UP_STATE=true' >> .env
          else
            echo 'DRY_RUN=true' >> .env
          fi
      - name: Update workflow
        run: |
          docker compose run provisioner /bin/bash -c 'set -o pipefail; ./common/workflow_utils.py generate-provision-workflow .github/workflows/provision.jsonnet | yq --prettyPrint > /tmp/provision.generated.yml && mv /tmp/provision.generated.yml .github/workflows/provision.generated.yml'
      - name: Create PR if there are changes
        id: create_pr
        uses: peter-evans/create-pull-request@6d6857d36972b65feb161a90e484f2984215f83e
        with:
          base: ${{ github.head_ref || github.ref_name }}
          branch: auto-update-${{ github.ref_name || github.ref_name }}
          title: '[Auto] Update from CI'
          body: |
            This PR was automatically created by the CI pipeline.

            Workflow: `${{ github.workflow }}`
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
            Source: ${{ github.ref }}
          commit-message: '[Auto] Update from CI'
      - name: Fail if there are changes
        if: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          echo "Changes are required. Please refer to pull request #${{ steps.create_pr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.create_pr.outputs.pull-request-url }}"
          exit 1
  provision-azure:
    needs:
      - update-workflow
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      AZURE_KEY_VAULT_ADMIN_OBJECT_IDS: ${{ vars.AZURE_KEY_VAULT_ADMIN_OBJECT_IDS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
        with: {}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@be3701b2116d2f723573ca9e8cdb4ca85d3cdaf0
      - name: Build the provisioner
        run: docker compose build provisioner
      - name: Set up environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo 'NO_CONFIRM=true' >> .env
            echo 'BACK_UP_STATE=true' >> .env
          else
            echo 'DRY_RUN=true' >> .env
          fi
      - name: Provision azure
        run: docker compose run provisioner ./azure/provision.py all
  provision-cloudflare:
    needs:
      - provision-azure
      - update-workflow
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GATE_CONTROLLER_ORIGIN_IP: ${{ vars.INGRESS_EXTERNAL_IP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
        with: {}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@be3701b2116d2f723573ca9e8cdb4ca85d3cdaf0
      - name: Build the provisioner
        run: docker compose build provisioner
      - name: Set up environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo 'NO_CONFIRM=true' >> .env
            echo 'BACK_UP_STATE=true' >> .env
          else
            echo 'DRY_RUN=true' >> .env
          fi
      - name: Provision cloudflare
        run: docker compose run provisioner ./cloudflare/provision.py all
  provision-kubernetes-shared:
    needs:
      - provision-azure
      - update-workflow
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      KEY_VAULT_SECRET_PROVIDER_CLIENT_ID: ${{ vars.KEY_VAULT_SECRET_PROVIDER_CLIENT_ID }}
      INGRESS_EXTERNAL_IP: ${{ vars.INGRESS_EXTERNAL_IP }}
      GATE_CONTROLLER_CLOUD_V3_IMAGE: ${{ vars.GATE_CONTROLLER_CLOUD_V3_IMAGE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
        with: {}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@be3701b2116d2f723573ca9e8cdb4ca85d3cdaf0
      - name: Build the provisioner
        run: docker compose build provisioner
      - name: Set up environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo 'NO_CONFIRM=true' >> .env
            echo 'BACK_UP_STATE=true' >> .env
          else
            echo 'DRY_RUN=true' >> .env
          fi
      - name: Provision kubernetes-shared
        run: docker compose run provisioner ./kubernetes-shared/provision.py all
  all-good:
    needs:
      - provision-azure
      - provision-cloudflare
      - provision-kubernetes-shared
      - update-workflow
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        name: Print success message if all jobs are successful
        run: echo 'All good!'
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Fail the job if one or more jobs failed
        run: echo 'One or more jobs failed.' && exit 1
