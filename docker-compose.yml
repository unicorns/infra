services:
  provisioner:
    build:
      context: .
      cache_from:
        - type=registry,ref=ghcr.io/unicorns/infra:buildcache
      platforms:
        - linux/amd64
    volumes:
      - .:/${COMPOSE_PROJECT_NAME:?}:ro
      # The output directory is mounted as rw so that the provisioner can write
      # to it.
      - ./outputs:/${COMPOSE_PROJECT_NAME:?}/outputs:rw
      # The .github/workflows directory is mounted as rw so that the provisioner
      # can generate workflows.
      - ./.github/workflows:/${COMPOSE_PROJECT_NAME:?}/.github/workflows:rw
      # Terragrunt copies provider locks from its cache after initialization.
      - ./kubernetes-shared/gate-controller-cloud-v3/.terraform.lock.hcl:/${COMPOSE_PROJECT_NAME:?}/kubernetes-shared/gate-controller-cloud-v3/.terraform.lock.hcl:rw
      - ./kubernetes-shared/kube-state-metrics/.terraform.lock.hcl:/${COMPOSE_PROJECT_NAME:?}/kubernetes-shared/kube-state-metrics/.terraform.lock.hcl:rw
      - ./kubernetes-shared/system/.terraform.lock.hcl:/${COMPOSE_PROJECT_NAME:?}/kubernetes-shared/system/.terraform.lock.hcl:rw
    tmpfs:
      - /run:exec
      - /tmp:exec
    working_dir: /${COMPOSE_PROJECT_NAME:?}
    # init handles signal forwarding so the container can be stopped gracefully.
    init: true
    environment:
      PYTHONPATH: /${COMPOSE_PROJECT_NAME:?}
      DRY_RUN: ${DRY_RUN:-}
      NO_CONFIRM: ${NO_CONFIRM:-}
      TF_TOKEN_app_terraform_io: ${TF_TOKEN_app_terraform_io:-}
      ARM_SUBSCRIPTION_ID: ${ARM_SUBSCRIPTION_ID:-}
      ARM_CLIENT_ID: ${ARM_CLIENT_ID:-}
      ARM_TENANT_ID: ${ARM_TENANT_ID:-}
      ARM_CLIENT_SECRET: ${ARM_CLIENT_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_KEY_VAULT_ADMIN_OBJECT_IDS: ${AZURE_KEY_VAULT_ADMIN_OBJECT_IDS:-}
      KEY_VAULT_ADMIN_OBJECT_IDS: ${KEY_VAULT_ADMIN_OBJECT_IDS:-}
      AZURE_AKS_ADMIN_GROUP_OBJECT_IDS: ${AZURE_AKS_ADMIN_GROUP_OBJECT_IDS:-}
      AKS_CLUSTER_NAME: ${AKS_CLUSTER_NAME:-}
      KUBE_CONFIG: ${KUBE_CONFIG:-}
      KUBE_CONFIG_PATH: ${KUBE_CONFIG_PATH:-}
      KUBECONFIG: ${KUBECONFIG:-}
      INGRESS_EXTERNAL_IP: ${INGRESS_EXTERNAL_IP:-}
      AKS_INGRESS_EXTERNAL_IP: ${AKS_INGRESS_EXTERNAL_IP:-}
      CI: ${CI:-}
