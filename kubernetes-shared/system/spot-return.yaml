kind: CronJob
schedule: '*/5 * * * *'
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1
ttlSecondsAfterFinished: 300
activeDeadlineSeconds: 60
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi
nodeSelector:
  kubernetes.azure.com/mode: system
cmdOptions:
  v: 2
deschedulerPolicy:
  nodeSelector: kubernetes.azure.com/mode=user
  maxNoOfPodsToEvictTotal: 1
  profiles:
    - name: prefer-spot
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            nodeSelector: kubernetes.azure.com/scalesetpriority=spot
            namespaceLabelSelector:
              matchLabels:
                unicorns.dev/satellite: 'true'
            minPodAge: 5m
            podProtections:
              defaultDisabled: [PodsWithLocalStorage]
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType: [preferredDuringSchedulingIgnoredDuringExecution]
      plugins:
        deschedule:
          enabled: [RemovePodsViolatingNodeAffinity]
