fullnameOverride: log-collector
remoteWrite:
  - url: http://logs.observability.svc:9428
    maxDiskUsagePerURL: 256MiB
collector:
  excludeFilter: kubernetes.pod_name:=%{HOSTNAME}
  includePodLabels: false
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi
env:
  - name: GOMEMLIMIT
    value: 96MiB
securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
tolerations:
  - key: kubernetes.azure.com/scalesetpriority
    operator: Equal
    value: spot
    effect: NoSchedule
defaultVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
defaultVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
persistence:
  volume:
    hostPath:
      path: /var/lib/vl-collector
      type: DirectoryOrCreate
